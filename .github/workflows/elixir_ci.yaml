name: Elixir CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

env:
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (mix.exs requires ~> 1.17)
          - elixir: "1.17.3"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3"
          # Newest toolchain; matches local development. The lint cell runs
          # the version-independent checks (format, audit, credo) once.
          # Exactly one cell reports coverage: coveralls closes a PR's build
          # on the first non-parallel upload, so a second reporting cell
          # would 422 whenever finish times diverge (e.g. uneven caches)
          - elixir: "1.20.3"
            otp: "29.0"
            coverage: true
            lint: true
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elixir and Erlang
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
        install-hex: true
        install-rebar: true

    - name: Restore deps and _build cache
      uses: actions/cache@v3
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

    - name: Clean to rule out incremental build as a source of flakiness
      if: github.run_attempt != '1'
      run: |
        mix deps.clean --all
        mix clean
      shell: sh

    - name: Install dependencies
      run: mix deps.get

    - name: Compiles without warnings
      run: mix compile --warnings-as-errors

    - name: Check Formatting
      if: matrix.lint
      run: mix format --check-formatted

    # One cell is enough: the advisory database is the same everywhere.
    - name: Audit dependencies for known vulnerabilities
      if: matrix.lint
      run: mix deps.audit

    - name: Credo
      if: matrix.lint
      run: mix credo --strict

    # Define how to cache the `plts` directory. After the first run,
    # this speeds up dialyzer runs a lot.
    - name: Cache PLTs
      id: cache-plts
      uses: actions/cache@v3
      with:
        path: plts
        key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-plts-v3-${{ hashFiles('**/mix.lock') }}

    - name: Dialyzer
      run: mix dialyzer

    - name: Run tests
      run: ${{ (github.event_name != 'schedule' && matrix.coverage) && 'mix coveralls.github' || 'mix test --warnings-as-errors' }}
